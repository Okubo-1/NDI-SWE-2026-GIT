<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        form > fieldset {
            display: flex;
            flex-direction: column;
            gap: 2;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <main>
        <form action="">
            <!--form controls-->
            <fieldset>
                <legend>Form Input Types</legend>

                <label for="">Full Name</label>
                <input id="FullName" type="text"> <!--Paschal Case Text Input-->

                <label for="">Current Password</label>
                <input id="CurrentPassword" type="password"><br>

                <label for="email">Email</label>
                <input id="email" type="email"><br>

                <label for="age">Age</label>
                <input id="age" type="numbers"><br>

                <label for="birthDate">Birth Date</label>
                <input id="birthDate" type="date"><br>

                <label for="subscribe">Subscribe</label>
                <input id="subscribe" type="checkbox"><br>

                <input type="radio"><br>
                <input type="file"><br>
                <input type="test"><br>
                <input type="submit"><br>
                <input type="color"><br>
                <input type="datetime-local"><br>
                <input type="time"><br>
                <input type="search"><br>

                <label for=""></label>
                <input type="tel"><br>
                <input type="range"><br>
                <input type="month"><br>
                <input type="week"><br>
                <input type="url"><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Form Input Attributes</legend>
                <input type="text" name="firstName" id=""> <!--name attribute-->
                <br>
                <input type="text" placehjolder="First Name"> <!--placeholder attribute-->
                <br>
                <input type="text" required> <!--required attribute-->
                <br>
                input
            </fieldset>
           
        </form>
    </main>
    
</body>
</html>
