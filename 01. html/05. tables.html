<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <main>
        <h1>HTML Tables</h1>

        <table border="1">
            <caption>
                Student Result
            </caption>
            <thead>
                <tr>
                    <td>Full Name</td>
                    <td>Age</td>
                    <td>Grade</td>
                    <td>Status</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Victor Okubowei</td>
                    <td>89</td>
                    <td>A</td>
                    <td>Active</td>
                </tr>
            </tbody>

        </table>

        <br>

        <table>
            <canvas>Table Intermediate</canvas>
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th> colspan="" First Term</th>
                    <th>Second Term</th>
                    <th>Third Term</th>

                </tr>
            </thead>
        </table>
    </main>
</body>
</html>
